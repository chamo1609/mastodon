name: Build and Push Chamomile Edition

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set platform pair string
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | sed 's/\//-/g' >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------
      # 1. Main Image 개별 아키텍처 빌드 및 다이제스트 추출
      # ---------------------------------------------------
      - name: Build and push Main Image by digest
        id: build-main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=main-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.platform }}

      - name: Export Main digest
        run: |
          mkdir -p /tmp/digests-main
          digest="${{ steps.build-main.outputs.digest }}"
          touch "/tmp/digests-main/${digest#sha256:}"

      - name: Upload Main digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-main-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests-main/*
          if-no-files-found: error
          retention-days: 1

      # ---------------------------------------------------
      # 2. Streaming Image 개별 아키텍처 빌드 및 다이제스트 추출
      # ---------------------------------------------------
      - name: Build and push Streaming Image by digest
        id: build-streaming
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./streaming/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-streaming,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=streaming-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=streaming-${{ matrix.platform }}

      - name: Export Streaming digest
        run: |
          mkdir -p /tmp/digests-streaming
          digest="${{ steps.build-streaming.outputs.digest }}"
          touch "/tmp/digests-streaming/${digest#sha256:}"

      - name: Upload Streaming digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-streaming-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests-streaming/*
          if-no-files-found: error
          retention-days: 1

  merge-images:
    runs-on: ubuntu-24.04
    needs: build-images
    permissions:
      packages: write
    steps:
      - name: Download Main digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-main-*
          path: /tmp/digests-main
          merge-multiple: true

      - name: Download Streaming digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-streaming-*
          path: /tmp/digests-streaming
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------
      # 3. 매니페스트 병합 및 최종 태그 Push
      # ---------------------------------------------------
      - name: Create manifest list and push Main Image
        working-directory: /tmp/digests-main
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Create manifest list and push Streaming Image
        working-directory: /tmp/digests-streaming
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-streaming:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-streaming:${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-streaming@sha256:%s ' *)
